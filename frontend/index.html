<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema Showtimes</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f8; }
    h1 { color: #222; }
    form { background: #fff; padding: 15px; border-radius: 8px; display: grid;
           grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 14px; border: 0; border-radius: 4px; cursor: pointer; }
    .save { background: #2e7d32; color: #fff; }
    .cancel { background: #888; color: #fff; }
    .edit { background: #1565c0; color: #fff; }
    .del { background: #c62828; color: #fff; }
    .table-wrap { overflow-x: auto; margin-top: 20px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; white-space: nowrap; }
    th { background: #333; color: #fff; }
  </style>
</head>
<body>
  <h1>🎬 Cinema Showtimes</h1>

  <form id="showForm">
    <input type="hidden" id="id">
    <input id="movie_title" placeholder="Movie title *" required>
    <input id="genre" placeholder="Genre">
    <input id="cinema_hall" placeholder="Cinema hall">
    <input id="show_date" type="date">
    <input id="show_time" type="time">
    <input id="ticket_price" type="number" step="0.01" placeholder="Ticket price">
    <input id="available_seats" type="number" placeholder="Available seats">
    <div>
      <button type="submit" class="save" id="saveBtn">Add Showtime</button>
      <button type="button" class="cancel" id="cancelBtn" style="display:none">Cancel</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Movie</th><th>Genre</th><th>Hall</th><th>Date</th>
          <th>Time</th><th>Price</th><th>Seats</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
